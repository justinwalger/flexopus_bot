[project]
name = "flexopus-4-7"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "coverage>=7.15.2",
    "deepeval>=4.1.1",
    "pre-commit>=4.6.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.21",
]
api = [
    "fastapi[standard]>=0.139.0",
    "langchain>=1.3.12",
    "langchain-google-genai>=4.2.7",
    "langchain-google-vertexai>=3.2.4",
    "langchain-openai>=1.3.4",
    "langchain-openrouter>=0.2.6",
    "langgraph-checkpoint-postgres>=3.1.0",
    "pydantic-settings>=2.7.0",
    "uvicorn>=0.35.0",
]
ui = [
    "htbuilder>=0.9.0",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.7.0",
    "streamlit>=1.59.1",
]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["api", "application", "llm", "ui"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
minversion = "9.0"
addopts = ["-ra", "-q"]
testpaths = [
    "tests",
]
markers = [
    "eval: calls a real LLM (slow, costs tokens, non-deterministic); run explicitly via `pytest evals/`",
]
