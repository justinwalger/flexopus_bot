name: Deploy to Cloud Run

on:
  push:
    branches:
      - main #

jobs:
  deploy-services:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy FastAPI Backend
        run: |
          cp Dockerfile.api Dockerfile

          gcloud run deploy fastapi-backend \
            --source . \
            --region europe-west1 \
            --allow-unauthenticated \
            --format="value(status.url)" > backend_url.txt

      - name: Deploy Streamlit Frontend
        run: |
          BACKEND_URL=$(cat backend_url.txt)
          echo "Backend running at: $BACKEND_URL"

          cp Dockerfile.streamlit Dockerfile

          gcloud run deploy streamlit-frontend \
            --source . \
            --region europe-west1 \
            --allow-unauthenticated \
            --set-env-vars BACKEND_API_URL=$BACKEND_URL/api
